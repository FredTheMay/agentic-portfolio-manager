# Investment Policy Statement (SPEC §6.3, §7).
#
# The IPS is configuration, not code. Every constraint the risk engine enforces
# is declared here so that changing policy is a reviewable diff rather than an
# edit to a conditional buried in an optimizer.
#
# CFA Standard III(A), loyalty and prudence: this file binds at runtime and
# there is no override path. An LLM cannot relax it, and neither can a caller —
# the engine takes the policy as an argument and re-verifies every constraint
# after any modification it makes.

# ---------------------------------------------------------------------------
# Objectives
# ---------------------------------------------------------------------------

return_objective:
  target_nominal_annual: "0.08"
  benchmark:
    # 60/40, the standard balanced reference (SPEC §6.3).
    SPY: "0.60"
    AGG: "0.40"

risk_objective:
  # CFA Level I: risk tolerance is the LOWER of ability and willingness.
  # Ability is a fact about the balance sheet and horizon; willingness is a
  # psychological constraint. A ten-year horizon gives above-average ability,
  # but pushing an investor past what they will actually sit through gets the
  # plan abandoned at the bottom, which is the single most expensive outcome
  # available. So willingness binds, and the engine asserts it.
  ability: ABOVE_AVERAGE
  willingness: MODERATE

  max_portfolio_beta: "1.20"
  max_annualized_volatility: "0.18"
  volatility_lookback_days: 60

  # Roy's safety-first (SPEC §6.1): maximize (E(Rp) - R_L) / sigma_p.
  # These two are policy choices, not derived facts, and are stated as such.
  # R_L = 0 encodes "do not lose money in nominal terms over the horizon".
  safety_first:
    threshold_return: "0.00"
    minimum_ratio: "0.30"

# ---------------------------------------------------------------------------
# Constraints, by the CFA Level I taxonomy
# ---------------------------------------------------------------------------

constraints:
  liquidity:
    min_cash_buffer: "0.05"

  legal_regulatory:
    long_only: true
    max_gross_exposure: "1.00" # no leverage

  tax:
    # Holdings sold inside 366 days realize short-term gains, taxed as ordinary
    # income. Not a veto — a penalty the optimizer weighs (M4).
    short_term_holding_days: 366
    short_term_gain_penalty: "0.15"
    wash_sale_window_days: 30

  time_horizon:
    years: 10
    stages: 1

  unique_circumstances:
    # Concentration limits. 10% per name and 30% per sector are the binding
    # diversification rules; see config/universe.yaml for the whitelist itself.
    max_position_weight: "0.10"
    max_sector_weight: "0.30"

# ---------------------------------------------------------------------------
# Rebalancing
# ---------------------------------------------------------------------------

rebalancing:
  # Trade only when a position has drifted more than 5 percentage points in
  # absolute terms. Rebalancing on smaller drift pays spread and commission to
  # correct noise.
  corridor_absolute: "0.05"

  # Cap on one-way turnover per cycle, as a fraction of portfolio value.
  max_turnover: "0.20"

  # Passed through to the execution layer in the mandate (SPEC §3.2). Not a
  # veto here: the decision layer does not size orders.
  min_trade_notional: "100.00"

# ---------------------------------------------------------------------------
# Circuit breaker
# ---------------------------------------------------------------------------

circuit_breaker:
  # Peak-to-trough drawdown beyond this forces the minimum-variance portfolio
  # and blocks any increase in risk until the drawdown recovers.
  max_drawdown: "0.15"
