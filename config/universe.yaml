# Investable universe (SPEC §6.3 UNIVERSE_WHITELIST, §6.8).
#
# Loaded and enforced by the risk engine at M3. Recorded here at M2 because the
# survivorship limitation below is a property of the *data*, and SPEC §4.4
# requires it stated prominently rather than buried.

# ---------------------------------------------------------------------------
# KNOWN LIMITATION — SURVIVORSHIP BIAS
# ---------------------------------------------------------------------------
# This list is fixed and current. It is NOT a point-in-time index membership
# series, so a backtest run over history holds instruments selected partly
# because they still exist today.
#
# The effect is upward and it is not small: names that were delisted, acquired,
# or went to zero never enter the sample, so the strategy is never charged for
# holding them. Published estimates of the bias in equity backtests run to
# roughly 1-4% annually, which is the same order as the excess return most
# strategies claim.
#
# Why it is not fixed here: point-in-time index constituent history is
# commercial data (CRSP, Compustat) and is not available on a free tier. The
# honest options were to buy it, or to state the limitation and refuse to
# present the backtest as though it were unbiased. This project does the
# second.
#
# What that means for reading the results:
#   - Absolute returns are overstated. Treat them as an upper bound.
#   - The benchmark (SPY/AGG) is affected by the same bias in the same
#     direction, so *relative* figures are less distorted than absolute ones.
#   - Constraint and veto counts, turnover, and implementation shortfall are
#     unaffected — they do not depend on which names survived.
#
# This limitation is repeated in the README and must also appear in the
# dashboard footer (SPEC §4.4, M9).

survivorship:
  point_in_time_constituents: false
  reason: "point-in-time index membership is commercial data; not available on a free tier"
  affects: ["absolute_return", "sharpe", "max_drawdown"]
  does_not_affect: ["constraint_counts", "turnover", "implementation_shortfall"]

# ---------------------------------------------------------------------------
# Whitelist
# ---------------------------------------------------------------------------
# Large, liquid US-listed instruments only. Liquidity is a constraint, not a
# preference: the naive executor sends market orders, and a thin name would
# make implementation shortfall a measure of the spread rather than of the
# strategy.

benchmark:
  # SPEC §6.3: 60/40 SPY/AGG.
  equity: SPY
  bonds: AGG
  equity_weight: "0.60"
  bond_weight: "0.40"

equities:
  - {symbol: AAPL, sector: INFORMATION_TECHNOLOGY}
  - {symbol: MSFT, sector: INFORMATION_TECHNOLOGY}
  - {symbol: NVDA, sector: INFORMATION_TECHNOLOGY}
  - {symbol: AVGO, sector: INFORMATION_TECHNOLOGY}
  - {symbol: GOOGL, sector: COMMUNICATION_SERVICES}
  - {symbol: META, sector: COMMUNICATION_SERVICES}
  - {symbol: AMZN, sector: CONSUMER_DISCRETIONARY}
  - {symbol: HD, sector: CONSUMER_DISCRETIONARY}
  - {symbol: PG, sector: CONSUMER_STAPLES}
  - {symbol: KO, sector: CONSUMER_STAPLES}
  - {symbol: COST, sector: CONSUMER_STAPLES}
  - {symbol: JNJ, sector: HEALTH_CARE}
  - {symbol: UNH, sector: HEALTH_CARE}
  - {symbol: LLY, sector: HEALTH_CARE}
  - {symbol: JPM, sector: FINANCIALS}
  - {symbol: BRK.B, sector: FINANCIALS}
  - {symbol: V, sector: FINANCIALS}
  - {symbol: XOM, sector: ENERGY}
  - {symbol: CVX, sector: ENERGY}
  - {symbol: CAT, sector: INDUSTRIALS}
  - {symbol: HON, sector: INDUSTRIALS}
  - {symbol: NEE, sector: UTILITIES}
  - {symbol: LIN, sector: MATERIALS}

# SPEC §6.8 requires REIT and commodity exposure so the alternative-investment
# concepts are exercised on real holdings rather than described in the abstract.
etfs:
  - {symbol: SPY, sector: BROAD_EQUITY, category: EQUITY_INDEX}
  - {symbol: AGG, sector: FIXED_INCOME, category: BOND_INDEX}
  - {symbol: VNQ, sector: REAL_ESTATE, category: REIT}
  - {symbol: DBC, sector: COMMODITIES, category: COMMODITY}
  - {symbol: GLD, sector: COMMODITIES, category: COMMODITY}

# Instruments deliberately excluded (SPEC §6.3, unique circumstances).
exclusions:
  - {symbol: TQQQ, reason: "leveraged; violates NO_LEVERAGE"}
  - {symbol: SQQQ, reason: "inverse; violates NO_SHORTING in substance"}
  - {symbol: UVXY, reason: "volatility product; not a long-horizon holding"}
