# nginx front end for the dashboard (M11, EC2).
#
# Serves the built React bundle and reverse-proxies /api to uvicorn on
# localhost. Single origin, so the browser makes no cross-origin request and
# the read-only API needs no CORS configuration.
#
# uvicorn binds 127.0.0.1 only (see agentic-portfolio.service), so the API is
# not reachable from the internet except through this server block.

server {
    listen 80 default_server;
    server_name _;

    root /opt/agentic-portfolio/web;
    index index.html;

    # Hardening. The app inlines no scripts and loads nothing off-host, so a
    # strict policy costs nothing and blocks a whole class of injection.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The first request after a restart runs a full backtest, which takes
        # longer than nginx's 60s default and would otherwise 504.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # Single-page app: an unknown path is a client route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
