# Categorical view -> numeric tilt (SPEC §5.4).
#
# THIS FILE IS WHERE AN LLM'S OPINION BECOMES A NUMBER.
#
# That conversion happens exactly once, here, by table lookup — never inside a
# model and never inside an agent. It is the mechanical form of SPEC §2.1: the
# LLM proposes a category and a conviction ordinal, and deterministic
# configuration turns that into an expected-return adjustment the optimizer can
# use.
#
# Why a table rather than, say, asking the model for a number: a number from a
# model is unauditable and unfalsifiable. A table is a reviewable diff, it is
# identical across runs, and when someone asks "why is this name overweight"
# the answer is a row rather than a sampling temperature.

# Tilts are annualized expected-return adjustments, added to the CAPM baseline
# in src/decision/optimizer.py.
#
# Sizing rationale: a maximum tilt of +/- 2% against equity risk premia of
# roughly 5-6% is deliberately small. Under semi-strong efficiency the prior is
# that qualitative research adds little; a tilt large enough to dominate the
# optimizer would be asserting otherwise. The position and sector caps bound
# the damage regardless.

tilts:
  BULLISH:
    1: "0.0025"
    2: "0.0050"
    3: "0.0100"
    4: "0.0150"
    5: "0.0200"
  NEUTRAL:
    1: "0.0000"
    2: "0.0000"
    3: "0.0000"
    4: "0.0000"
    5: "0.0000"
  BEARISH:
    1: "-0.0025"
    2: "-0.0050"
    3: "-0.0100"
    4: "-0.0150"
    5: "-0.0200"

# How the three agents combine into one view per name.
#
# The fundamental analyst gets the most weight because its input is a
# deterministic ratio table computed in Python (SPEC §5.2) — the model is
# interpreting arithmetic it was handed, not recalling facts. The research
# agent reads news and is the most exposed to stale or thin sourcing. Macro is
# a portfolio-level signal applied to every name, so it gets the least
# per-name weight.
agent_weights:
  fundamental: "0.50"
  research: "0.30"
  macro: "0.20"

# A view with no dated citation is discarded to NEUTRAL (SPEC §5.1, CFA
# Standard V(A): reasonable basis). Set to 0 to disable the requirement, which
# would mean accepting recommendations with no support.
minimum_citations: 1

# Absolute ceiling on the combined tilt for any one name, after aggregation.
# Belt and braces against a table edit that accidentally scales everything.
max_absolute_tilt: "0.0200"
