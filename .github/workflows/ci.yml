name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # SPEC §3.2 — the boundary contract must compile.
      - name: Generate protobuf stubs
        run: |
          mkdir -p src/execution/proto_gen
          touch src/execution/proto_gen/__init__.py
          python -m grpc_tools.protoc -Iproto \
            --python_out=src/execution/proto_gen \
            --pyi_out=src/execution/proto_gen \
            --grpc_python_out=src/execution/proto_gen \
            proto/execution.proto

      # SPEC §2.2 — a violation fails the build.
      - name: Import contracts
        run: lint-imports

      - name: Type check
        run: mypy src tests

      # Structural tests: no wall clock, layer isolation, null-LLM pipeline,
      # no numeric fields in LLM schemas.
      - name: Tests
        run: pytest -v
