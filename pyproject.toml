[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-portfolio-manager"
version = "0.1.0"
description = "Multi-agent AI portfolio manager over a deterministic risk engine (paper trading only)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "pydantic>=2",
    "fastapi",
    "httpx",
    "grpcio",
    "grpcio-tools",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "import-linter",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

# >=90% coverage on src/cfa/ and src/risk/ — the two packages where a silent
# arithmetic error would propagate into every downstream number. `make
# coverage` gates on exactly those; the rest of the tree is reported, not
# gated.
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/execution/proto_gen/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
# Generated protobuf stubs are not our code and are not type-clean.
exclude = "^src/execution/proto_gen/"

# These ship no type information. numpy and pandas do, and are checked.
# (`scipy-stubs` exists if we ever want scipy checked too.)
[[tool.mypy.overrides]]
# boto3, mangum, aws_cdk and constructs are AWS-only and live in
# infra/requirements.txt, deliberately outside this project's dependencies.
module = [
    "grpc_tools.*",
    "google.protobuf.*",
    "scipy.*",
    "sklearn.*",
    "yaml",
    "boto3",
    "mangum",
    "aws_cdk.*",
    "constructs",
]
ignore_missing_imports = true

# The decision layer must not know about execution.
[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "Decision layer knows nothing about execution"
type = "forbidden"
source_modules = ["src.decision"]
forbidden_modules = ["src.execution"]

[[tool.importlinter.contracts]]
name = "CFA layer is pure: no I/O, no LLM, no execution"
type = "forbidden"
source_modules = ["src.cfa"]
forbidden_modules = ["src.llm", "src.execution", "src.data", "src.api"]

[[tool.importlinter.contracts]]
name = "Risk engine is pure: no LLM, no execution, no I/O"
type = "forbidden"
source_modules = ["src.risk"]
forbidden_modules = ["src.llm", "src.execution", "src.api"]
