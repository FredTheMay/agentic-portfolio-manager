[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-portfolio-manager"
version = "0.1.0"
description = "Multi-agent AI portfolio manager over a deterministic risk engine (paper trading only)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "pydantic>=2",
    "fastapi",
    "httpx",
    "grpcio",
    "grpcio-tools",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "mypy",
    "import-linter",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
# Generated protobuf stubs are not our code and are not type-clean.
exclude = "^src/execution/proto_gen/"

[[tool.mypy.overrides]]
module = ["grpc_tools.*", "google.protobuf.*"]
ignore_missing_imports = true

# --- SPEC §2.2: the decision layer must not know about execution ---
[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "Decision layer knows nothing about execution (SPEC 2.2)"
type = "forbidden"
source_modules = ["src.decision"]
forbidden_modules = ["src.execution"]

[[tool.importlinter.contracts]]
name = "CFA layer is pure: no I/O, no LLM, no execution (SPEC 6)"
type = "forbidden"
source_modules = ["src.cfa"]
forbidden_modules = ["src.llm", "src.execution", "src.data", "src.api"]

[[tool.importlinter.contracts]]
name = "Risk engine is pure: no LLM, no execution, no I/O (SPEC 7)"
type = "forbidden"
source_modules = ["src.risk"]
forbidden_modules = ["src.llm", "src.execution", "src.api"]
